name: MOLIDO PHONE AI - Android Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "=== ROOT ==="
          ls -la

          echo "=== CHECK REQUIRED FILES ==="

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "All required files found."

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: molido-phone-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
